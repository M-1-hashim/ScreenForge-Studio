<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>countdown</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        pointer-events: none;
      }
      #num {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font: 800 160px/1 'Segoe UI', sans-serif;
        color: #f59e0b;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.6);
      }
      #tip {
        position: fixed;
        top: calc(50% + 110px);
        left: 50%;
        transform: translateX(-50%);
        font: 500 15px/1 'Segoe UI', sans-serif;
        color: #e6e9ef;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="num">3</div>
    <div id="tip">Recording starts…</div>
    <script type="module" src="/countdown/countdown.ts"></script>
  </body>
</html>
