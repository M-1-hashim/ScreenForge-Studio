<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>region</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: crosshair;
        user-select: none;
      }
      #dim {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 14, 0.35);
      }
      #hint {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        color: #e6e9ef;
        font: 500 13px/1.4 'Segoe UI', sans-serif;
        background: rgba(14, 17, 22, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 8px 14px;
        border-radius: 8px;
        pointer-events: none;
      }
      #sel {
        position: fixed;
        display: none;
        border: 2px solid #f59e0b;
        background: rgba(245, 158, 11, 0.08);
        pointer-events: none;
      }
      #size {
        position: fixed;
        display: none;
        color: #ffd58a;
        font: 600 12px/1 'Consolas', monospace;
        background: rgba(14, 17, 22, 0.9);
        border: 1px solid rgba(245, 158, 11, 0.5);
        padding: 4px 8px;
        border-radius: 6px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="dim"></div>
    <div id="hint">Drag to select the recording area — Enter to confirm, Esc to cancel</div>
    <div id="sel"></div>
    <div id="size"></div>
    <script type="module" src="/region/region-selector.ts"></script>
  </body>
</html>
